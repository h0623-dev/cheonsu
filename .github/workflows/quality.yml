name: Cloud Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-cloud-smoke.mjs
      - run: node scripts/verify-town-camera.mjs
      - run: node scripts/verify-monster-enemies.mjs
      - run: node scripts/verify-skill-spectacle.mjs
      - run: node scripts/verify-deployment.mjs
      - run: node scripts/verify-campaign-progression.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cloud-qa-${{ github.run_id }}
          path: |
            tmp/cloud-qa/
            tmp/town-camera-qa/
            tmp/monster-enemies-qa/
            tmp/skill-spectacle-qa/
            tmp/deployment-qa/
            tmp/campaign-progression-qa/
          retention-days: 14
