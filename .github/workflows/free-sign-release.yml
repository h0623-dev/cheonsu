# 비활성 설치 템플릿: 실제 공개 배포 저장소를 등록하기 전 실행하지 않습니다.
# 설치 경로: 새 public h0623-dev/cheonsu/.github/workflows/free-sign-release.yml
# CONTROL_SOURCE_REVISION은 이 공개 저장소에 최소 제어 파일만 별도로 커밋한
# 승인 SHA입니다. private 원본의 소스 커밋/트리를 공개로 가져오지 않습니다.
name: Free protected Android APK and OTA
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: '현재 private main push의 성공 run ID'
        type: string
        required: true
      source_run_attempt:
        description: '완료된 원본 run attempt'
        type: string
        required: true
      source_sha:
        description: '현재 원본 main의 전체40자리 SHA'
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: cheonsu-public-signing
  cancel-in-progress: false
jobs:
  protected-release:
    if: github.repository == 'h0623-dev/cheonsu' && github.event.repository.private == false && github.ref == 'refs/heads/main' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: cheonsu-release
    env:
      CONTROL_SOURCE_REVISION: 881d7fa34ce7e0c3a88ccef3d812f25961bb03d7
      # Created inside the protected management workflow only after finalize.
      # The requester/publisher credentials cannot write Environment Secrets.
      CHEONSU_FREE_RELEASE_ACTIVATION: ${{ secrets.CHEONSU_FREE_RELEASE_ACTIVATION }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Require enrolled immutable public control revision
        shell: bash
        run: |
          if [[ ! "$CONTROL_SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]; then
            echo '운영 등록 전 템플릿입니다. 승인된 공개 제어 코드 SHA가 필요합니다.'
            exit 1
          fi
          ulimit -c 0
          # 공통 출력 경로는 runner가 배정된 실행 단계에서 설정합니다.
          printf 'CHEONSU_RELEASE_OUTPUT=%s/cheonsu-signed-output\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CONTROL_SOURCE_REVISION }}
          path: trusted-control
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Authorize the private main build before exposing signing identities
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_READ_TOKEN: ${{ secrets.SOURCE_ARTIFACT_READ_TOKEN }}
        run: node trusted-control/ops/free-release/authorize-request.mjs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install the approved Android signing tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Sign approved data with the unchanged Android and OTA identities
        # Private checkout, private scripts, npm/Gradle, caches and caller URLs
        # are never used in this job. Both key variables belong to the exact
        # main-only PUBLIC Environment, not Repository Secrets.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_READ_TOKEN: ${{ secrets.SOURCE_ARTIFACT_READ_TOKEN }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          OTA_PRIVATE_KEY_PEM: ${{ secrets.OTA_PRIVATE_KEY_PEM }}
        shell: bash
        run: |
          set +x
          ulimit -c 0
          node trusted-control/ops/free-release/public/sign-release.mjs
      - name: Publish immutable APK and OTA, then advance the existing channel
        # The publisher receives no signing keys. Its token is restricted to
        # this public repository's Contents:write, without Workflows/Admin.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_READ_TOKEN: ${{ secrets.SOURCE_ARTIFACT_READ_TOKEN }}
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: node trusted-control/ops/free-release/publish-release.mjs
      - name: Remove temporary signed output
        if: always()
        shell: bash
        run: rm -rf -- "$CHEONSU_RELEASE_OUTPUT"
      # No upload-artifact/cache/source-archive step is allowed in this job.
      # Signing files are cleaned in the signer finally block; signed output
      # is cleaned here. Original private artifacts expire after one day.
