name: Android APK and OTA
on:
  workflow_dispatch:
    inputs:
      publish:
        description: '검증 후 새 버전 APK/소스/서명 OTA를 공개 배포'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'index.html'
      - 'vite.config.js'
      - 'docs/update-notes.json'
permissions:
  contents: read
concurrency:
  group: cheonsu-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'h0623-dev/cheonsu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: cheonsu-release
    permissions:
      contents: write
    env:
      PUBLISH_UPDATE: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: git config core.fileMode false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: npm ci
      - name: Check immutable release version
        if: env.PUBLISH_UPDATE == 'true'
        run: node scripts/check-cloud-release.mjs
      - run: npm run lint
      - run: npm test
      - name: Restore existing signing identities
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          OTA_PRIVATE_KEY_PEM: ${{ secrets.OTA_PRIVATE_KEY_PEM }}
        run: node scripts/cloud-signing.mjs
      - run: npm run android:apk
      - name: Report selected Android signing identity
        working-directory: android
        run: ./gradlew :app:signingReport
      - name: Name final APK
        id: version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "cheonsu_${VERSION}_update_debug.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify final APK
        shell: pwsh
        run: ./scripts/verify-update-artifacts.ps1 -ApkOnly
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-cloud-smoke.mjs
      - run: node scripts/verify-town-camera.mjs
      - run: node scripts/verify-monster-enemies.mjs
      - run: node scripts/verify-skill-spectacle.mjs
      - run: node scripts/verify-deployment.mjs
      - run: node scripts/verify-campaign-progression.mjs
      - run: node scripts/verify-stage-missions.mjs
      - run: npm run update:package
      - name: Verify APK and signed OTA payloads
        shell: pwsh
        run: ./scripts/verify-update-artifacts.ps1
      - run: npm run package:source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cheonsu-${{ steps.version.outputs.version }}-cloud-${{ github.run_id }}
          path: |
            cheonsu_*_update_debug.apk
            cheonsu_development_*.zip
            update-release/*/*.zip
            update-release/*/latest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Publish immutable APK, source and signed OTA
        if: env.PUBLISH_UPDATE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run update:publish
      - name: Clean signing files
        if: always()
        run: node scripts/cloud-signing.mjs --cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-qa-${{ github.run_id }}
          path: |
            tmp/cloud-qa/
            tmp/town-camera-qa/
            tmp/monster-enemies-qa/
            tmp/skill-spectacle-qa/
            tmp/deployment-qa/
            tmp/campaign-progression-qa/
            tmp/stage-missions-qa/
          retention-days: 14
